<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>

  <script>
    const path = window.location.pathname;
    const prefix = "/tstaff";

    let rest = path.startsWith(prefix)
      ? path.slice(prefix.length)
      : "";

    window.location.replace("https://tcfthailand.com/onejamal" + rest + window.location.search + window.location.hash);
  </script>
</head>
</html>
